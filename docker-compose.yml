services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: prodify-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Prodify_Dev_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - prodify-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: prodify-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Prodify;User Id=sa;Password=Prodify_Dev_2026!;TrustServerCertificate=True;"
    ports:
      - "5255:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  prodify-sqlserver-data: